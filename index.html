    /* =========================================================
       THEMES — defined as CSS variables.
       Default :root is the pink theme; .theme-blue overrides.
       Any element with .theme-pink or .theme-blue scopes the
       theme to that subtree (used by subject cards on the
       select screen so each previews its own color).
       ========================================================= */
    :root, .theme-pink {

      --bg-shade-rgb: 28 14 21;

      --ambient-1: rgba(255, 141, 179, 0.13);

    }

      --fog-rgb:      192 204 222;
      --chalk-rgb:    232 238 248;
      --bone-rgb:     211 222 240;
      --rose-rgb:     126 180 255;
      --blush-rgb:    170 207 255;
      --hot-rgb:      74 143 255;
      --coral-rgb:    130 200 212;
      --peach-rgb:    184 216 232;
      --berry-rgb:    214 63 99;
      --ambient-1: rgba(126, 180, 255, 0.14);
      --ambient-2: rgba(130, 200, 212, 0.08);
      --ambient-3: rgba(74, 143, 255, 0.06);
    }

    .theme-gold {
      --bg-base-rgb:  18 13 8;
      --bg-shade-rgb: 26 19 12;
      --bg-ash-rgb:   38 28 17;
      --bg-steel-rgb: 56 40 22;
      --bg-iron-rgb:  86 62 34;
      --mist-rgb:     178 162 138;
      --fog-rgb:      220 202 175;
      --chalk-rgb:    246 235 214;
      --bone-rgb:     235 213 173;
      --rose-rgb:     240 192 96;
      --blush-rgb:    248 220 156;
      --hot-rgb:      220 156 56;
      --coral-rgb:    224 154 108;
      --peach-rgb:    240 216 168;
      --berry-rgb:    214 63 99;
      --ambient-1: rgba(240, 192, 96, 0.13);
      --ambient-2: rgba(224, 154, 108, 0.10);
      --ambient-3: rgba(220, 156, 56, 0.06);
    }

    .theme-green {
      --bg-base-rgb:  8 22 16;
      --bg-shade-rgb: 11 28 21;
      --bg-ash-rgb:   14 38 28;
      --bg-steel-rgb: 22 56 40;
      --bg-iron-rgb:  38 84 60;
      --mist-rgb:     145 175 158;
      --fog-rgb:      192 218 202;
      --chalk-rgb:    230 246 235;
      --bone-rgb:     210 232 218;
      --rose-rgb:     110 224 168;
      --blush-rgb:    168 232 192;
      --hot-rgb:      46 200 128;
      --coral-rgb:    110 200 200;
      --peach-rgb:    200 224 184;
      --berry-rgb:    214 63 99;
      --ambient-1: rgba(110, 224, 168, 0.13);
      --ambient-2: rgba(110, 200, 200, 0.08);
      --ambient-3: rgba(46, 200, 128, 0.06);
    }

    html, body { background-color: rgb(var(--bg-base-rgb)); color: rgb(var(--chalk-rgb)); }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.005em;
      transition: background-color 0.7s ease, color 0.7s ease;
    }

    /* Dot grid — uses theme accent */
    .bg-dots {
      background-image: radial-gradient(rgb(var(--rose-rgb) / 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      background-position: 14px 14px;
      transition: background-image 0.7s ease;
    }

    /* Ambient corner blooms — themed */
    .ambient::before {
      content: '';
      position: fixed; inset: 0; z-index: 50;
      background:
        radial-gradient(ellipse 65% 55% at 12% 8%, var(--ambient-1), transparent 70%),
        radial-gradient(ellipse 55% 45% at 92% 92%, var(--ambient-2), transparent 70%),
        radial-gradient(ellipse 40% 30% at 95% 10%, var(--ambient-3), transparent 70%),
        radial-gradient(ellipse at center, transparent 0%, transparent 55%, rgb(var(--bg-base-rgb) / 0.65) 100%);
      pointer-events: none;
      transition: background 0.7s ease;
    }

    /* Faint scanlines */
    .scanlines::after {
      content: '';
      position: fixed; inset: 0; z-index: 60;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.02) 3px, rgba(0,0,0,0.02) 4px
      );
      pointer-events: none;
    }

    /* Grain */
    .grain::before {
      content: '';
      position: fixed; inset: 0; z-index: 55;
      background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/></svg>");
      opacity: 0.04; pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* Themed glows */
    .glow-rose  { text-shadow: 0 0 10px rgb(var(--rose-rgb) / 0.55), 0 0 32px rgb(var(--rose-rgb) / 0.22); }
    .glow-hot   { text-shadow: 0 0 10px rgb(var(--hot-rgb) / 0.55),  0 0 32px rgb(var(--hot-rgb) / 0.22); }
    .glow-peach { text-shadow: 0 0 10px rgb(var(--peach-rgb) / 0.55); }
    .glow-berry { text-shadow: 0 0 10px rgb(var(--berry-rgb) / 0.55); }

    /* Themed shadows — used instead of arbitrary Tailwind rgba shadows */
    .shadow-accent-bar   { box-shadow: 0 0 18px rgb(var(--rose-rgb) / 0.65); }
    .shadow-accent-dot   { box-shadow: 0 0 14px rgb(var(--rose-rgb) / 0.95), 0 0 32px rgb(var(--rose-rgb) / 0.55); }
    .shadow-accent-pop   { box-shadow: 0 0 40px -10px rgb(var(--rose-rgb) / 0.75); }
    .shadow-accent-soft  { box-shadow: 0 20px 60px -20px rgb(var(--rose-rgb) / 0.55); }

    /* Cursor */
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    .cursor::after {
      content: '▍'; display: inline-block;
      animation: blink 1.1s steps(1) infinite;
      margin-left: 6px; transform: translateY(-2px);
      color: rgb(var(--rose-rgb));
    }

    /* Animations */
    @keyframes slideUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    .slide-up { animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }

    @keyframes slideLeft { from { opacity: 0; transform: translateX(48px); } to { opacity: 1; transform: translateX(0); } }
    .slide-left { animation: slideLeft 0.5s cubic-bezier(0.16,1,0.3,1) both; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 0.55s ease both; }

    @keyframes scorePop {
      0%   { transform: translate(-50%, 4px) scale(0.85); opacity: 0; }
      20%  { transform: translate(-50%, 0) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -56px) scale(1.05); opacity: 0; }
    }
    .score-pop { animation: scorePop 1.2s cubic-bezier(0.16,1,0.3,1) forwards; }

    @keyframes scoreBump {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .score-bump { animation: scoreBump 0.55s cubic-bezier(0.16,1,0.3,1); }

    @keyframes pulse {
      0%, 100% { opacity: 0.9; box-shadow: 0 0 0 0 rgb(var(--rose-rgb) / 0.55); }
      50%      { opacity: 1;   box-shadow: 0 0 0 7px rgb(var(--rose-rgb) / 0); }
    }
    .pulse-dot { animation: pulse 2.4s ease-in-out infinite; }

    /* Selection */
    ::selection { background: rgb(var(--rose-rgb) / 0.45); color: rgb(var(--chalk-rgb)); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgb(var(--bg-base-rgb)); }
    ::-webkit-scrollbar-thumb { background: rgb(var(--bg-steel-rgb)); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(var(--bg-iron-rgb)); }

    button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 1px solid rgb(var(--rose-rgb) / 0.7); outline-offset: 3px; border-radius: 2px; }

    .meta {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-feature-settings: "ss01";
    }

    .letter-badge { transition: all 0.3s cubic-bezier(0.16,1,0.3,1); }

    .opt {
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1),
                  background-color 0.3s ease,
                  border-color 0.3s ease,
                  color 0.3s ease,
                  box-shadow 0.4s ease;
    }
    .opt-idle:hover {
      background: rgb(var(--rose-rgb) / 0.055);
      border-color: rgb(var(--rose-rgb) / 0.5);
      transform: translateY(-1px);
    }
    .opt-idle:hover .letter-badge {
      background: rgb(var(--rose-rgb) / 0.18);
      border-color: rgb(var(--rose-rgb) / 0.6);
      color: rgb(var(--rose-rgb));
    }
    .opt-idle:hover .arrow { opacity: 0.7; transform: translateX(0); }

    .card-soft {
      transition: transform 0.5s cubic-bezier(0.16,1,0.3,1),
                  border-color 0.4s ease,
                  background-color 0.4s ease,
                  box-shadow 0.5s ease;
    }
    .card-soft:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 26px 70px -30px rgb(var(--rose-rgb) / 0.4);
    }

    .progress-fill { transition: width 0.75s cubic-bezier(0.16,1,0.3,1); }

    .ring-soft { box-shadow: inset 0 0 0 1px rgb(var(--chalk-rgb) / 0.025); }

    .tnum { font-variant-numeric: tabular-nums; }
  </style>
</head>

/* Utilities */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleOptions(q) {
  const correctText = q.options[q.correct];
  const newOptions = shuffle(q.options);
  return { ...q, options: newOptions, correct: newOptions.indexOf(correctText) };
}
function buildSession(questions, limit) {
  const shuffled = shuffle(questions).map(shuffleOptions);
  if (typeof limit === 'number' && limit > 0 && limit < shuffled.length) {
    return shuffled.slice(0, limit);
  }
  return shuffled;
}

/* Personlig rekord pr. fag — gemmes lokalt i browseren. */
function loadBest(subjectId) {
  try {
    const raw = localStorage.getItem(`quiz-best-${subjectId}`);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveBest(subjectId, result) {
  try { localStorage.setItem(`quiz-best-${subjectId}`, JSON.stringify(result)); } catch {}
}
function isBetterThan(now, prev) {
  if (!prev) return true;
  if (now.pct !== prev.pct) return now.pct > prev.pct;
  return now.score > prev.score;
}

/* Livstidsstatistik — samlet score på tværs af alle fag og sessioner. */
const EMPTY_STATS = { score: 0, played: 0, correct: 0, wrong: 0 };
function loadStats() {
  try {
    const raw = localStorage.getItem('quiz-lifetime-stats');
    return raw ? { ...EMPTY_STATS, ...JSON.parse(raw) } : { ...EMPTY_STATS };
  } catch { return { ...EMPTY_STATS }; }
}
function addStats({ score, correct, wrong }) {
  const s = loadStats();
  s.score   += score;
  s.played  += 1;
  s.correct += correct;
  s.wrong   += wrong;
  try { localStorage.setItem('quiz-lifetime-stats', JSON.stringify(s)); } catch {}
  return s;
}

/* =========================================================
   ROOT
   ========================================================= */
function App() {
  const [screen, setScreen] = useState('select'); // select | quiz | result | stats
  const [subject, setSubject] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [score, setScore] = useState(0);
  const [history, setHistory] = useState([]);
  const goToStats = () => setScreen('stats');

  const startQuiz = (s, limit) => {
    if (!s.available) return;
    setSubject(s);
    setQuestions(buildSession(s.questions, limit));
    setQIndex(0);
    setScore(0);
    setHistory([]);
    setScreen('quiz');
  };

  const onAnswer = ({ correct, topic, delta }) => {
    setScore(prev => Math.max(0, prev + delta));
    setHistory(h => [...h, { correct, topic }]);
  };

  const onNext = () => {
    if (qIndex + 1 >= questions.length) setScreen('result');
    else setQIndex(i => i + 1);
  };

  const playAgain = () => {
    setScreen('select');
    setSubject(null);
    setQuestions([]);
    setQIndex(0);
    setScore(0);
    setHistory([]);
  };

  // Bekræft før man forlader en igangværende quiz — ellers ryger fremskridtet.
  const [showExitConfirm, setShowExitConfirm] = useState(false);
  const handleHome = () => {
    if (screen === 'quiz') {
      setShowExitConfirm(true);
      return;
    }
    playAgain();
  };
  const confirmExit = () => { setShowExitConfirm(false); playAgain(); };
  const cancelExit  = () => setShowExitConfirm(false);

  // Apply the current subject's theme class to <body> so the
  // CSS variables cascade to the whole document (incl. body bg).
  // Forsiden bruger det blå tema som standard.
  useEffect(() => {
    const cls = subject ? `theme-${subject.accent}` : 'theme-blue';
    document.body.classList.add(cls);
    return () => document.body.classList.remove(cls);
  }, [subject]);

  // Dynamisk page title — viser hvor man er i fanen.
  useEffect(() => {
    const base = 'Quiz · Skoleøvelse';
    if (screen === 'quiz' && subject && questions.length > 0) {
      document.title = `${subject.title} · ${qIndex + 1}/${questions.length} · Quiz`;
    } else if (screen === 'result' && subject) {
      document.title = `Resultat · ${subject.title}`;
    } else {
      document.title = base;
    }
  }, [screen, subject, qIndex, questions.length]);

  return (
    <div className="min-h-screen relative">
      <TopChrome screen={screen} subject={subject} qIndex={qIndex} total={questions.length} score={score} onHome={handleHome} />
      <main className="px-5 sm:px-10 lg:px-14 pt-28 pb-20 max-w-[1240px] mx-auto">
        {screen === 'select' && <SelectScreen subjects={SUBJECTS} onSelect={startQuiz} onShowStats={goToStats} />}
        {screen === 'quiz' && (
          <QuizScreen
            subject={subject}
            questions={questions}
            qIndex={qIndex}
            score={score}
            onAnswer={onAnswer}
            onNext={onNext}
          />
        )}
        {screen === 'result' && (
          <ResultScreen subject={subject} score={score} history={history} onPlayAgain={playAgain} />
        )}
        {screen === 'stats' && (
          <StatsScreen subjects={SUBJECTS} onBack={playAgain} />
        )}
      </main>
      <BottomChrome screen={screen} />
      {showExitConfirm && <ExitConfirmModal onConfirm={confirmExit} onCancel={cancelExit} />}
    </div>
  );
}

  return `${p(d.getHours())}:${p(d.getMinutes())}`;

      <div className="grid grid-cols-4 gap-x-3 gap-y-3 mb-7 pb-7 border-b border-iron/40">
        <Stat label="emner" value={String(topics.length).padStart(2,'0')} />
        <Stat label="spørgsmål" value={String(questions.length)} />
        <Stat label="tid" value={`~${Math.ceil(questions.length * 0.4)}m`} />
        <Stat label="niveau" value="begynder" />
      </div>

      {/* Topic chips */}
      <div className="mb-9 flex-1">
        <div className="font-mono text-[10px] meta text-mist mb-3">// dækker</div>
        <div className="flex flex-wrap gap-1.5">
          {topics.map(t => (
            <span key={t} className="font-mono text-[10.5px] px-2.5 py-1 rounded-md border border-iron/60 text-fog group-hover:border-rose/30 group-hover:text-bone transition-all duration-500">
              {t}
            </span>
          ))}
        </div>
      </div>

      {/* Personlig rekord */}
      {best && (
        <div className="mt-auto mb-4 font-mono text-[10px] meta text-mist flex items-center gap-2 flex-wrap">
          <span className="text-rose">★</span>
          <span>bedste:</span>
          <span className="text-rose tnum">{best.score}</span>
          <span className="text-iron">·</span>
          <span className="text-rose">{best.pct}%</span>
        </div>
      )}

      {/* Antal-vælger / start */}
      <div className={best ? '' : 'mt-auto'}>
        <div className="font-mono text-[10px] meta text-mist mb-3">// start med</div>
        <div className="flex flex-wrap gap-2">
          {counts.map(c => (
            <button
              key={c}
              onClick={() => onSelect(subject, c)}
              className="font-mono text-xs px-4 py-2.5 rounded-md border border-iron/60 hover:border-rose/60 hover:bg-rose/5 hover:text-rose text-fog transition-all duration-300 tnum"
            >
              {c} spm
            </button>
          ))}
          <button
            onClick={() => onSelect(subject)}
            className="font-mono text-xs px-4 py-2.5 rounded-md border border-rose/60 bg-rose/10 hover:bg-rose/20 text-rose transition-all duration-300 inline-flex items-center gap-2"
          >
            <span>alle ({questions.length})</span>
            <span className="transform group-hover:translate-x-0.5 transition-transform">→</span>
          </button>
        </div>
      </div>
    </div>
  );
}

function Stat({ label, value }) {
  return (
    <div>
      <div className="font-mono text-[10px] meta text-mist mb-1">{label}</div>
      <div className="font-serif text-2xl text-chalk tnum">{value}</div>
    </div>
  );
}

/* =========================================================
   QUIZ SCREEN
   ========================================================= */
function QuizScreen({ subject, questions, qIndex, score, onAnswer, onNext }) {
  const q = questions[qIndex];
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [scorePops, setScorePops] = useState([]);
  const [scoreKey, setScoreKey] = useState(0);
  const advanceTimer = useRef(null);

  useEffect(() => {
    setSelected(null);
    setRevealed(false);
  }, [qIndex]);

  useEffect(() => {
    const onKey = (e) => {
      if (revealed) return;
      const idx = ['1','2','3','4'].indexOf(e.key);
      if (idx >= 0 && idx < q.options.length) handleSelect(idx);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  useEffect(() => () => clearTimeout(advanceTimer.current), []);

  const handleSelect = (idx) => {
    if (revealed) return;
    const correct = idx === q.correct;
    const delta = correct ? +10 : -5;

    setSelected(idx);
    setRevealed(true);
    onAnswer({ correct, topic: q.topic, delta });
    setScoreKey(k => k + 1);

    const popId = Date.now();
    setScorePops(arr => [...arr, { id: popId, delta }]);
    setTimeout(() => setScorePops(arr => arr.filter(p => p.id !== popId)), 1200);

    clearTimeout(advanceTimer.current);
    advanceTimer.current = setTimeout(() => onNext(), correct ? 950 : 1750);
  };

  const progress = (qIndex / questions.length) * 100;
  const progressNext = ((qIndex + 1) / questions.length) * 100;
  const visibleProgress = revealed ? progressNext : progress;

  return (
    <div className="pt-2">
      {/* Top bar: progress + status */}
      <div className="mb-12 sm:mb-16">
        <div className="flex items-end justify-between mb-4 gap-6">
          <div className="flex items-center gap-3 sm:gap-4 font-mono text-[10px] meta">
            <span className="text-rose">{subject.code}</span>
            <span className="w-1 h-1 rounded-full bg-iron" />
            <span className="text-mist">spørgsmål</span>
            <span className="font-serif text-[18px] sm:text-[22px] text-chalk tnum tracking-tight">
              {String(qIndex + 1).padStart(2,'0')}
              <span className="text-iron mx-1.5">/</span>
              <span className="text-mist">{String(questions.length).padStart(2,'0')}</span>
            </span>
          </div>

          <ScoreReadout score={score} pops={scorePops} bumpKey={scoreKey} />
        </div>

        {/* Progress */}
        <div className="relative h-[5px] bg-ash rounded-full overflow-hidden">
          <div
            className="absolute inset-y-0 left-0 bg-gradient-to-r from-coral via-rose to-hot rounded-full progress-fill shadow-accent-bar"
            style={{ width: `${visibleProgress}%` }}
          />
          <div
            className="absolute top-1/2 w-2.5 h-2.5 -mt-[5px] rounded-full bg-rose progress-fill shadow-accent-dot"
            style={{ left: `calc(${visibleProgress}% - 5px)` }}
          />
        </div>
      </div>

      {/* Question + answers */}
      <div key={qIndex} className="slide-left">
        <div className="mb-10 flex items-center gap-3 flex-wrap">
          <span className="font-mono text-[10px] meta text-mist">Emne</span>
          <span className="inline-flex items-center gap-2 font-mono text-[11px] text-rose px-3 py-1.5 rounded-full border border-rose/25 bg-rose/[0.07]">
            <span className="w-1 h-1 rounded-full bg-rose" />
            {q.topic}
          </span>
        </div>

        <div className="mb-14 max-w-4xl">
          <h2 className="font-serif font-light text-[32px] sm:text-[44px] lg:text-[56px] leading-[1.08] tracking-[-0.015em] text-chalk">
            {q.question}
          </h2>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4 max-w-5xl">
          {q.options.map((opt, idx) => (
            <Option
              key={idx}
              idx={idx}
              text={opt}
              isSelected={selected === idx}
              isCorrect={idx === q.correct}
              revealed={revealed}
              onClick={() => handleSelect(idx)}
            />
          ))}
        </div>

        <div className="mt-10 min-h-[28px] font-mono text-xs meta">
          {revealed && (
            <div className="fade-in flex items-center gap-3">
              {selected === q.correct ? (
                <>
                  <span className="text-rose">●</span>
                  <span className="text-rose">korrekt</span>
                  <span className="text-iron">·</span>
                  <span className="text-mist">+10 point</span>
                </>
              ) : (
                <>
                  <span className="text-berry">●</span>
                  <span className="text-berry">forkert</span>
                  <span className="text-iron">·</span>
                  <span className="text-mist">−5 point · korrekt svar markeret</span>
                </>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const LETTERS = ['A', 'B', 'C', 'D'];

function Option({ idx, text, isSelected, isCorrect, revealed, onClick }) {
  let state = 'idle';
  if (revealed) {
    if (isCorrect) state = 'correct';
    else if (isSelected && !isCorrect) state = 'wrong';
    else state = 'dim';
  }

  const containerCls = {
    idle:    'opt-idle border-iron/60 bg-shade/40 text-chalk',
    correct: 'border-rose/80 bg-rose/[0.1] text-chalk cursor-default',
    wrong:   'border-berry/70 bg-berry/[0.1] text-chalk cursor-default',
    dim:     'border-iron/30 bg-shade/20 text-mist/70 cursor-default'
  }[state];

  const badgeCls = {
    idle:    'border-iron/70 text-mist bg-ink/40',
    correct: 'border-transparent text-ink bg-rose',
    wrong:   'border-transparent text-cream bg-berry',
    dim:     'border-iron/40 text-mist/50 bg-ink/30'
  }[state];

  return (
    <button
      onClick={onClick}
      disabled={revealed}
      className={[
        'opt group relative text-left border px-5 sm:px-6 py-4 sm:py-5 rounded-lg',
        'flex items-center gap-4 sm:gap-5',
        containerCls,
        state === 'correct' ? 'shadow-accent-pop' : '',
      ].join(' ')}
    >
      <span className={[
        'letter-badge flex-shrink-0 w-10 h-10 rounded-md flex items-center justify-center',
        'border font-mono text-[13px] font-semibold',
        badgeCls
      ].join(' ')}>
        {state === 'correct' ? '✓' : state === 'wrong' ? '✕' : LETTERS[idx]}
      </span>
      <span className="font-sans text-[15px] sm:text-[17px] leading-snug flex-1">
        {text}
      </span>
      {!revealed && (
        <span className="arrow font-mono text-mist/40 opacity-0 transition-opacity duration-300 text-lg">→</span>
      )}
    </button>
  );
}

function ScoreReadout({ score, pops, bumpKey }) {
  return (
    <div className="relative flex items-baseline gap-3 font-mono text-[10px] meta">
      <span className="text-mist">Score</span>
      <span
        key={bumpKey}
        className="score-bump font-serif text-[28px] sm:text-[34px] text-rose glow-rose tnum tracking-tight leading-none"
      >
        {String(score).padStart(3, '0')}
      </span>
      {pops.map(p => (
        <span
          key={p.id}
          className={[
            'score-pop absolute left-1/2 top-1 font-mono font-bold text-sm pointer-events-none',
            p.delta > 0 ? 'text-rose glow-rose' : 'text-berry glow-berry'
          ].join(' ')}
        >
          {p.delta > 0 ? `+${p.delta}` : p.delta}
        </span>
      ))}
    </div>
  );
}

/* =========================================================
   RESULT SCREEN
   ========================================================= */
function ResultScreen({ subject, score, history, onPlayAgain }) {
  const total = history.length;
  const correct = history.filter(h => h.correct).length;
  const wrong   = total - correct;
  const pct     = total > 0 ? Math.round((correct / total) * 100) : 0;

  // Personlig rekord: hent forrige, opdater hvis bedre.
  const [prevBest, setPrevBest] = useState(null);
  const [isNewRecord, setIsNewRecord] = useState(false);
  useEffect(() => {
    const existing = loadBest(subject.id);
    setPrevBest(existing);
    const now = { score, correct, total, pct, date: new Date().toISOString().slice(0, 10) };
    if (isBetterThan(now, existing)) {
      setIsNewRecord(true);
      saveBest(subject.id, now);
    }
    // Læg sessionens resultat til den samlede livstidsstatistik.
    addStats({ score, correct, wrong });
  }, []);

  const byTopic = useMemo(() => {
    const map = {};
    history.forEach(h => {
      if (!map[h.topic]) map[h.topic] = { correct: 0, total: 0 };
      map[h.topic].total += 1;
      if (h.correct) map[h.topic].correct += 1;
    });
    return Object.entries(map)
      .map(([topic, v]) => ({ topic, ...v, pct: Math.round((v.correct / v.total) * 100) }))
      .sort((a, b) => b.pct - a.pct);
  }, [history]);

  const verdict =
    pct >= 90 ? { headline: 'Helt i top.',       note: 'Du har styr på faget. Imponerende.' } :
    pct >= 70 ? { headline: 'Pænt klaret.',      note: 'Solid præstation. Lidt finpudsning og du er der.' } :
    pct >= 50 ? { headline: 'Du nåede igennem.', note: 'Grundlaget er der. Repetér de svage emner.' } :
                { headline: 'Næsten der.',       note: 'Vend tilbage til pensum og prøv en gang til.' };

  return (
    <div className="slide-up max-w-6xl">
      <div className="font-mono text-[11px] meta text-rose mb-6 flex items-center gap-3 flex-wrap">
        <span className="inline-block w-6 h-px bg-rose/60" />
        <span>session afsluttet</span>
        {isNewRecord && (
          <span className="ml-2 inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-rose bg-rose/15 text-rose glow-rose">
            <span className="text-base leading-none">★</span>
            <span>ny personlig rekord</span>
          </span>
        )}
      </div>

      <h1 className="font-serif font-light text-[56px] sm:text-[88px] lg:text-[112px] leading-[0.92] tracking-[-0.02em] mb-3 text-chalk">
        {verdict.headline}
      </h1>
      <p className="font-serif italic text-xl sm:text-2xl text-fog mb-16 max-w-2xl">
        {verdict.note}
      </p>

      <div className="grid grid-cols-1 lg:grid-cols-[1fr,1.15fr] gap-5 mb-6">
        {/* Score block */}
        <div className="border border-iron/50 bg-shade/40 ring-soft rounded-xl p-8 sm:p-12 relative overflow-hidden">
          <div className="font-mono text-[10px] meta text-mist mb-5">Slutscore</div>
          <div className="flex items-end gap-4">
            <div className="font-serif font-light text-[140px] sm:text-[180px] leading-[0.85] text-rose glow-rose tnum tracking-[-0.04em]">
              {score}
            </div>
            <div className="pb-6 font-mono text-xs text-mist">
              <div>af</div>
              <div className="text-chalk tnum">{total * 10}</div>
              <div>mulige</div>
            </div>
          </div>

          {prevBest && !isNewRecord && (
            <div className="mt-6 font-mono text-[11px] meta text-mist flex items-center gap-2 flex-wrap">
              <span>personlig rekord:</span>
              <span className="text-rose tnum">{prevBest.score}</span>
              <span className="text-iron">·</span>
              <span className="text-rose">{prevBest.pct}%</span>
            </div>
          )}
          {isNewRecord && prevBest && (
            <div className="mt-6 font-mono text-[11px] meta text-mist flex items-center gap-2 flex-wrap">
              <span>forrige rekord:</span>
              <span className="text-fog tnum">{prevBest.score}</span>
              <span className="text-iron">·</span>
              <span className="text-fog">{prevBest.pct}%</span>
            </div>
          )}

          <div className="mt-10 pt-8 border-t border-iron/40 grid grid-cols-3 gap-2">
            <StatBlock label="korrekt" value={correct} accent="text-rose" />
            <StatBlock label="forkert" value={wrong}   accent="text-berry" />
            <StatBlock label="ratio"   value={`${pct}%`} accent="text-chalk" />
          </div>
        </div>

        {/* Topic breakdown */}
        <div className="border border-iron/50 bg-shade/40 ring-soft rounded-xl p-8 sm:p-12">
          <div className="flex items-baseline justify-between mb-8">
            <h3 className="font-serif italic text-2xl text-bone">Pr. emne</h3>
            <span className="font-mono text-[10px] meta text-mist">{byTopic.length} emner</span>
          </div>
          <div className="space-y-5">
            {byTopic.map((row, i) => (
              <TopicRow key={row.topic} row={row} delay={i * 70} />
            ))}
          </div>
        </div>
      </div>

      <div className="mt-12 flex flex-col sm:flex-row gap-5 items-stretch sm:items-center">
        <button
          onClick={onPlayAgain}
          className="group relative overflow-hidden rounded-xl px-8 py-5 bg-rose text-ink hover:bg-bone transition-all duration-500 flex items-center gap-4 shadow-accent-soft"
        >
          <span className="font-mono text-[10px] meta tracking-[0.25em]">spil igen</span>
          <span className="font-serif italic text-2xl">tag den om</span>
          <span className="ml-2 transform group-hover:translate-x-1 transition-transform duration-300 text-lg">→</span>
        </button>
        <span className="font-mono text-[10px] meta text-mist sm:ml-3">
          spørgsmål og svar blandes på ny
        </span>
      </div>
    </div>
  );
}

function TopicRow({ row, delay }) {
  const barTone = row.pct >= 70 ? 'bg-rose' : row.pct >= 40 ? 'bg-peach' : 'bg-berry';
  const txtTone = row.pct >= 70 ? 'text-rose' : row.pct >= 40 ? 'text-peach' : 'text-berry';
  return (
    <div className="slide-left" style={{ animationDelay: `${delay}ms` }}>
      <div className="flex items-baseline justify-between mb-2 gap-3">
        <span className="font-serif italic text-[17px] text-chalk truncate">{row.topic}</span>
        <span className="font-mono text-[11px] text-mist tnum whitespace-nowrap">
          <span className="text-fog">{row.correct}/{row.total}</span>
          <span className={`ml-3 ${txtTone}`}>{row.pct}%</span>
        </span>
      </div>
      <div className="h-[3px] bg-ash rounded-full overflow-hidden">
        <div className={`h-full ${barTone} progress-fill rounded-full`} style={{ width: `${row.pct}%` }} />
      </div>
    </div>
  );
}

function StatBlock({ label, value, accent }) {
  return (
    <div>
      <div className="font-mono text-[10px] meta text-mist mb-1">{label}</div>
      <div className={`font-serif font-light text-4xl sm:text-5xl tnum ${accent}`}>{value}</div>
    </div>
  );
}

/* =========================================================
   STATS SCREEN — Mine point pr. fag + samlet
   ========================================================= */
function StatsScreen({ subjects, onBack }) {
  const [stats, setStats] = useState(() => loadStats());
  const [bestBySubject, setBestBySubject] = useState(() =>
    Object.fromEntries(subjects.map(s => [s.id, loadBest(s.id)]))
  );

  const items = subjects.filter(s => s.available);

  const handleReset = () => {
    const ok = window.confirm('Er du sikker på, at du vil nulstille al statistik og alle rekorder? Dette kan ikke fortrydes.');
    if (!ok) return;
    try {
      localStorage.removeItem('quiz-lifetime-stats');
      subjects.forEach(s => localStorage.removeItem(`quiz-best-${s.id}`));
    } catch {}
    setStats({ ...EMPTY_STATS });
    setBestBySubject(Object.fromEntries(subjects.map(s => [s.id, null])));
  };

  return (
    <div className="slide-up">
      {/* Eyebrow + tilbage */}
      <div className="font-mono text-[11px] meta text-rose mb-6 flex items-center gap-3 flex-wrap">
        <button onClick={onBack} className="hover:text-bone transition-colors flex items-center gap-2">
          <span>←</span>
          <span>tilbage</span>
        </button>
        <span className="inline-block w-6 h-px bg-rose/60" />
        <span>min statistik</span>
      </div>

      {/* Hero */}
      <h1 className="font-serif font-light text-[64px] sm:text-[88px] lg:text-[112px] leading-[0.92] tracking-[-0.02em] mb-12 text-chalk">
        Mine <span className="italic text-rose glow-rose">point.</span>
      </h1>

      {/* Samlet score */}
      <div className="mb-14 border-y border-iron/40 py-10 sm:py-12">
        <div className="flex items-end justify-between gap-8 flex-wrap">
          <div>
            <div className="font-mono text-[10px] meta text-mist mb-3">samlet score</div>
            <div className="font-serif font-light text-[88px] sm:text-[128px] leading-[0.85] text-rose glow-rose tnum tracking-[-0.02em]">
              {stats.score.toLocaleString('da-DK')}
            </div>
            <div className="font-mono text-[10px] meta text-mist mt-3">
              point på tværs af alle fag og sessioner
            </div>
          </div>
          <div className="flex gap-10 sm:gap-14 pb-3">
            <div>
              <div className="font-mono text-[10px] meta text-mist mb-2">quizzer</div>
              <div className="font-serif font-light text-4xl sm:text-5xl text-bone tnum">{stats.played}</div>
            </div>
            <div>
              <div className="font-mono text-[10px] meta text-mist mb-2">korrekte</div>
              <div className="font-serif font-light text-4xl sm:text-5xl text-rose tnum">{stats.correct}</div>
            </div>
            <div>
              <div className="font-mono text-[10px] meta text-mist mb-2">forkerte</div>
              <div className="font-serif font-light text-4xl sm:text-5xl text-berry tnum">{stats.wrong}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Rekorder pr. fag */}
      <div className="mt-2">
        <div className="flex items-end justify-between mb-6">
          <h2 className="font-mono text-[10px] meta text-mist">Rekorder pr. fag</h2>
          <span className="font-mono text-[10px] meta text-iron tnum">
            {items.filter(s => bestBySubject[s.id]).length} / {items.length} spillet
          </span>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {items.map(s => {
            const b = bestBySubject[s.id];
            return (
              <div
                key={s.id}
                className={`theme-${s.accent} border border-iron/60 bg-shade/40 ring-soft rounded-xl p-7 sm:p-8`}
              >
                <div className="flex items-center justify-between mb-5">
                  <span className="font-mono text-[10px] meta text-mist">{s.code}</span>
                  {b && (
                    <span className="font-mono text-[10px] meta text-rose inline-flex items-center gap-1.5">
                      <span>★</span>
                      <span>rekord</span>
                    </span>
                  )}
                </div>
                <h3 className="font-serif text-3xl sm:text-4xl text-chalk mb-1 leading-none">{s.title}</h3>
                <p className="font-serif italic text-fog/80 text-sm sm:text-[15px] mb-6">{s.tagline}</p>
                {b ? (
                  <div className="flex items-baseline gap-3 flex-wrap">
                    <span className="font-serif font-light text-5xl text-rose glow-rose tnum tracking-tight leading-none">{b.score}</span>
                    <span className="text-iron">·</span>
                    <span className="font-mono text-sm text-rose tnum">{b.pct}%</span>
                    <span className="text-iron">·</span>
                    <span className="font-mono text-xs text-mist tnum">{b.correct}/{b.total} rigtige</span>
                  </div>
                ) : (
                  <div className="font-mono text-xs meta text-mist">endnu ikke spillet</div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Nulstil */}
      <div className="mt-16 pt-8 border-t border-iron/40">
        <button
          onClick={handleReset}
          className="font-mono text-[11px] meta text-mist hover:text-berry transition-colors inline-flex items-center gap-2"
        >
          <span>↺</span>
          <span>nulstil al statistik og rekorder</span>
        </button>
      </div>
    </div>
  );
}

/* =========================================================
   MOUNT
   ========================================================= */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
